      "command": [
       "python3",
       "/tools/collector.py",
       "--namespaces",
       "cap-w1,cap-w2,cap-w3,cap-w4",
       "--until",
       "1792577880",
       "--outdir",
       "/results",
       "--t0",
       "1792574880"
      ],
      "imagePullPolicy": "IfNotPresent",
      "volumeMounts": [
       {
        "name": "plan",
        "mountPath": "/plan"
       },
       {
        "name": "results",
        "mountPath": "/results"
       }
      ],
