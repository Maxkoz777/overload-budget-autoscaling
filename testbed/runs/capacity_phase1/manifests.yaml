   "data": {
    "loadgen.json": "{\n \"schedules\": {\n  \"single\": \"/plan/single.csv\"\n },\n \"targets\": [\n  {\n   \"name\": \"w1-single\",\n   \"function\": \"single\",\n   \"url\": \"http://single.cap-w1.svc.cluster.local/work\"\n  },\n  {\n   \"name\": \"w2-single\",\n   \"function\": \"single\",\n   \"url\": \"http://single.cap-w2.svc.cluster.local/work\"\n  },\n  {\n   \"name\": \"w3-single\",\n   \"function\": \"single\",\n   \"url\": \"http://single.cap-w3.svc.cluster.local/work\"\n  },\n  {\n   \"name\": \"w4-single\",\n   \"function\": \"single\",\n   \"url\": \"http://single.cap-w4.svc.cluster.local/work\"\n  }\n ],\n \"seed\": 20261017,\n \"minutes\": 45,\n \"interval_seconds\": 60\n}",
    "single.csv": "demand\n120\n120\n120\n240\n240\n240\n360\n360\n360\n480\n480\n480\n600\n600\n600\n720\n720\n720\n840\n840\n840\n960\n960\n960\n1080\n1080\n1080\n1200\n1200\n1200\n1320\n1320\n1320\n1440\n1440\n1440\n1560\n1560\n1560\n1680\n1680\n1680\n1800\n1800\n1800\n"
