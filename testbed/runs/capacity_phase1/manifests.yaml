      "command": [
       "sleep",
       "infinity"
      ],
      "imagePullPolicy": "IfNotPresent",
      "volumeMounts": [
       {
        "name": "plan",
        "mountPath": "/plan"
       },
       {
        "name": "results",
        "mountPath": "/results"
       }
      ],
      "resources": {
       "requests": {
        "cpu": "200m",
        "memory": "128Mi"
       }
      }
     }
    ],
