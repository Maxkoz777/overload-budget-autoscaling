     "app": "f1",
     "testbed": "worker"
    }
   },
   "spec": {
    "replicas": 3,
    "selector": {
     "matchLabels": {
      "app": "f1"
     }
    },
    "template": {
     "metadata": {
      "labels": {
       "app": "f1",
       "testbed": "worker"
      }
     },
     "spec": {
      "nodeSelector": {
       "testbed-node": "w1"
      },
      "terminationGracePeriodSeconds": 5,
      "containers": [
       {
        "name": "worker",
        "image": "ghcr.io/maxkoz777/testbed-worker@sha256:157fd62347bdba85f2c7833e9e23a2ad17e248a7e8bafa876623060e7bb064b5",
        "imagePullPolicy": "IfNotPresent",
        "env": [
         {
          "name": "ITER",
          "value": "10400"
         },
         {
          "name": "WARMUP_SECONDS",
          "value": "15"
         },
         {
          "name": "MAX_INFLIGHT",
          "value": "8"
         }
        ],
        "ports": [
         {
          "containerPort": 8080
         }
        ],
        "resources": {
         "requests": {
          "cpu": "40m",
          "memory": "32Mi"
         },
         "limits": {
          "cpu": "40m",
          "memory": "64Mi"
         }
        },
        "readinessProbe": {
         "httpGet": {
          "path": "/healthz",
          "port": 8080
         },
         "periodSeconds": 2,
         "timeoutSeconds": 2,
         "failureThreshold": 3,
         "successThreshold": 1
        }
       }
      ],
      "imagePullSecrets": [
       {
        "name": "testbed-pull"
       }
      ]
     }
    }
   }
